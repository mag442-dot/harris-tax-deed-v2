name: Official Harris December auction acquisition
on:
  workflow_dispatch:
  schedule:
    - cron: '47 14 * * *'
permissions:
  contents: read
concurrency:
  group: harris-dec2026-official-source
  cancel-in-progress: false
jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run official December inventory ingestion
        run: python pipeline.py --sale-date 2026-12-01 --state-dir state
      - name: Enrich all December accounts against official parcel GIS
        run: python enrich.py --inventory state/2026-12-01/latest.json --out state/enrichment
      - name: Query FEMA and retain unknown/error evidence
        run: python flood.py --inventory state/enrichment/enriched.json --out state/flood
      - name: Preserve complete evidence, including failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harris-dec2026-official-evidence
          path: state/
          retention-days: 90
          if-no-files-found: warn
