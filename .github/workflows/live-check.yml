name: Official source integration check
on:
  push:
    paths:
      - 'pipeline.py'
      - '.github/workflows/live-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-source-check
  cancel-in-progress: false
jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate live November inventory without publishing to Sheets
        run: python pipeline.py --sale-date 2026-11-03 --state-dir state
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-evidence
          path: state/
          retention-days: 14
          if-no-files-found: warn
