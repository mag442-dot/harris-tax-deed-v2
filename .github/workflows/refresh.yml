name: Daily November inventory refresh
on:
  schedule:
    - cron: '47 13 * * *'
    - cron: '47 14 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh.yml'
permissions:
  contents: read
concurrency:
  group: harris-official-source
  cancel-in-progress: false
env:
  SALE_DATE: '2026-11-03'
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select 8:47 Houston run and stop after this sale
        id: clock
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, date
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('America/Chicago'))
          active = now.date() <= date.fromisoformat(os.environ['SALE_DATE'])
          cron = '47 13 * * *' if now.utcoffset().total_seconds() == -18000 else '47 14 * * *'
          selected = os.environ['EVENT'] != 'schedule' or os.environ['CRON'] == cron
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('run=' + str(active and selected).lower() + '\n')
          PY
      - uses: actions/cache/restore@v4
        if: steps.clock.outputs.run == 'true'
        with:
          path: |
            state/2026-11-03/latest.json
            state/flood/enriched.json
          key: november-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: november-v2-
      - name: Fetch and validate official listing
        if: steps.clock.outputs.run == 'true'
        run: python pipeline.py --sale-date "$SALE_DATE" --state-dir state
      - name: Enrich every account from official HCAD GIS
        if: steps.clock.outputs.run == 'true'
        run: python enrich.py --inventory state/2026-11-03/latest.json --out state/enrichment
      - name: Record FEMA parcel intersections or explicit source failures
        if: steps.clock.outputs.run == 'true'
        run: python flood.py --inventory state/enrichment/enriched.json --out state/flood --resume state/flood/enriched.json
      - name: Build machine-readable report
        if: steps.clock.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from reporting import report_rows
          doc = json.loads(Path('state/flood/enriched.json').read_text())
          Path('state/report.json').write_text(json.dumps(report_rows(doc)))
          blocked = sum(r['hcad_gis']['status'] == 'BLOCKED' for r in doc['records'])
          if blocked:
              raise SystemExit(f'{blocked} HCAD lookups blocked; inspect evidence')
          PY
      - uses: actions/cache/save@v4
        if: success() && steps.clock.outputs.run == 'true'
        with:
          path: |
            state/2026-11-03/latest.json
            state/flood/enriched.json
          key: november-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.clock.outputs.run == 'true'
        with:
          name: november-inventory-${{ github.run_id }}
          path: state/
          retention-days: 90
          if-no-files-found: warn
